name: Test auto-backup RED
on: [push]
jobs:
  test:
    if: contains(github.event.head_commit.message, 'RED auto-backup')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Lägg till JUnit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle')
          s = p.read_text(encoding='utf-8')
          if 'dependencies {' not in s:
              s += "\ndependencies { testImplementation 'junit:junit:4.13.2' }\n"
          p.write_text(s, encoding='utf-8')
          PY
      - name: Kör auto-backup-test
        run: gradle :app:testDebugUnitTest --tests se.steffy.receptboken.AutoBackupPolicyTest
