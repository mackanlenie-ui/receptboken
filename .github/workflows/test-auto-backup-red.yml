name: Test auto-backup policy
on: [push]
jobs:
  test:
    if: contains(github.event.head_commit.message, 'RED auto-backup') || contains(github.event.head_commit.message, 'GREEN auto-backup')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Återskapa v1.6.0-grunden
        run: |
          base64 -d signing/min-dagbok-release.jks.b64 > signing/min-dagbok-release.jks
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          def run_python_block(path, section):
              wf = Path(path).read_text(encoding='utf-8')
              section_pos = wf.index(section)
              marker = "          python3 - <<'PY'\n"
              start = wf.index(marker, section_pos) + len(marker)
              end = wf.index("\n          PY", start)
              code = textwrap.dedent(wf[start:end])
              exec(compile(code, path, 'exec'), {'__name__': '__main__'})

          run_python_block('.github/workflows/build-apk-v142.yml', '- name: Återskapa v1.4.1-grunden')
          run_python_block('.github/workflows/build-apk-v142.yml', '- name: Förbättra scrollning i skrivläget')
          PY
          python3 scripts/v150_patch.py
          python3 scripts/v160_patch.py
      - name: Lägg till JUnit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle')
          s = p.read_text(encoding='utf-8')
          if 'dependencies {' not in s:
              s += "\ndependencies { testImplementation 'junit:junit:4.13.2' }\n"
          p.write_text(s, encoding='utf-8')
          PY
      - name: Kör auto-backup-test
        run: gradle :app:testDebugUnitTest --tests se.steffy.receptboken.AutoBackupPolicyTest
