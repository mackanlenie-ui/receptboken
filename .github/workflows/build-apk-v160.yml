name: Bygg Min Dagbok v1.6.0
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Återskapa v1.4.2-grunden
        run: |
          base64 -d signing/min-dagbok-release.jks.b64 > signing/min-dagbok-release.jks
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          def run_python_block(path, section):
              wf = Path(path).read_text(encoding='utf-8')
              section_pos = wf.index(section)
              marker = "          python3 - <<'PY'\n"
              start = wf.index(marker, section_pos) + len(marker)
              end = wf.index("\n          PY", start)
              code = textwrap.dedent(wf[start:end])
              exec(compile(code, path, 'exec'), {'__name__': '__main__'})

          run_python_block('.github/workflows/build-apk-v142.yml', '- name: Återskapa v1.4.1-grunden')
          run_python_block('.github/workflows/build-apk-v142.yml', '- name: Förbättra scrollning i skrivläget')
          PY

      - name: Återskapa v1.5.0 DeX
        run: python3 scripts/v150_patch.py

      - name: Förbättra mobilvyn
        run: python3 scripts/v160_patch.py

      - name: Bygg Min Dagbok
        run: gradle :app:assembleDebug

      - name: Döp APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Min-Dagbok-v1.6.0.apk

      - name: Verifiera APK och signering
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs Min-Dagbok-v1.6.0.apk
          "$AAPT" dump badging Min-Dagbok-v1.6.0.apk | head -8

      - uses: actions/upload-artifact@v4
        with:
          name: Min-Dagbok-v1.6.0
          path: Min-Dagbok-v1.6.0.apk
