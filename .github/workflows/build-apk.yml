name: Bygg Min Dagbok
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Förbered Min Dagbok v1.1
        run: |
          python3 - <<'PY'
          from pathlib import Path

          java = Path('app/src/main/java/se/steffy/receptboken/DiaryMainActivity.java')
          s = java.read_text(encoding='utf-8')
          replacements = {
              'import android.app.BiometricPrompt;': 'import android.hardware.biometrics.BiometricPrompt;',
              'BiometricPrompt.BIOMETRIC_ERROR_NEGATIVE_BUTTON': '13',
              'root.addView(buildPhoneHeader(), new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(64)));': 'root.addView(buildPhoneHeader(), new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(76)));',
              'bar.setPadding(dp(18), 0, dp(12), 0);': 'bar.setPadding(dp(18), dp(12), dp(12), 0);',
              'root.addView(buildBottomNav(), new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(70)));': 'root.addView(buildBottomNav(), new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(78)));',
              'b.setTextSize(11);': 'b.setTextSize(13);\n        b.setTypeface(Typeface.DEFAULT, Typeface.BOLD);',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Saknar förväntad kod: {old}')
              s = s.replace(old, new)
          java.write_text(s, encoding='utf-8')

          gradle = Path('app/build.gradle')
          g = gradle.read_text(encoding='utf-8')
          g = g.replace("versionCode 1", "versionCode 2")
          g = g.replace("versionName '1.0'", "versionName '1.1'")
          gradle.write_text(g, encoding='utf-8')
          PY
      - name: Bygg Min Dagbok
        run: gradle :app:assembleDebug
      - name: Döp APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Min-Dagbok-v1.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Min-Dagbok-APK
          path: Min-Dagbok-v1.1.apk
