name: Bygg APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug :reklamskydd:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Receptboken-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ReklamSkydd-APK
          path: reklamskydd/build/outputs/apk/debug/reklamskydd-debug.apk
