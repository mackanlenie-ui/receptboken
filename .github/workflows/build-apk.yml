name: Bygg Min Dagbok
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Förbered Min Dagbok v1.4.0
        run: |
          base64 -d signing/min-dagbok-release.jks.b64 > signing/min-dagbok-release.jks
          python3 - <<'PY'
          from pathlib import Path

          java = Path('app/src/main/java/se/steffy/receptboken/DiaryMainActivity.java')
          s = java.read_text(encoding='utf-8')

          replacements = {
              'import android.app.BiometricPrompt;': 'import android.hardware.biometrics.BiometricPrompt;\nimport android.hardware.biometrics.BiometricManager;',
              'import android.view.WindowManager;': 'import android.view.WindowManager;\nimport android.view.WindowInsets;',
              'private FrameLayout pageHost;': 'private FrameLayout pageHost;\n    private View bottomNavView;\n    private final android.os.Handler autosaveHandler = new android.os.Handler(android.os.Looper.getMainLooper());\n    private final Runnable autosaveRunnable = () -> autosaveEditor(false);',
              'super.onCreate(savedInstanceState);': 'super.onCreate(savedInstanceState);\n        if (Build.VERSION.SDK_INT >= 30) {\n            getWindow().setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_ADJUST_NOTHING);\n        } else {\n            getWindow().setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE);\n        }',
              'root.addView(buildPhoneHeader(), new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(64)));': 'root.addView(buildPhoneHeader(), new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(76)));',
              'bar.setPadding(dp(18), 0, dp(12), 0);': 'bar.setPadding(dp(18), dp(12), dp(12), 0);',
              'root.addView(buildBottomNav(), new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(70)));': 'bottomNavView = buildBottomNav();\n            root.addView(bottomNavView, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(78)));',
              'b.setTextSize(11);': 'b.setTextSize(13);\n        b.setTypeface(Typeface.DEFAULT, Typeface.BOLD);',
              'settings.setOnClickListener(v -> showSettings());': 'settings.setOnClickListener(v -> { if ("editor".equals(currentPage)) autosaveEditor(false); showSettings(); });',
              'if (!isChangingConfigurations()) lastPaused = System.currentTimeMillis();': 'if ("editor".equals(currentPage)) autosaveEditor(false);\n        if (!isChangingConfigurations()) lastPaused = System.currentTimeMillis();',
              'hideKeyboard();\n        switch (page) {': 'if ("editor".equals(currentPage)) autosaveEditor(false);\n        hideKeyboard();\n        switch (page) {',
              'c.addView(stats, slp);': 'c.addView(stats, slp);\n\n        c.addView(moodOverviewCard(), cardLp());',
              'title.addTextChangedListener(simpleWatcher(s -> editorEntry.title = s));': 'title.addTextChangedListener(simpleWatcher(s -> { editorEntry.title = s; scheduleAutosave(); }));',
              'body.addTextChangedListener(simpleWatcher(s -> editorEntry.body = s));': 'body.addTextChangedListener(simpleWatcher(s -> { editorEntry.body = s; scheduleAutosave(); }));',
              'editorEntry.mood = mood;\n                renderEditor();': 'editorEntry.mood = mood;\n                autosaveEditor(false);\n                renderEditor();',
              'favorite.setOnCheckedChangeListener((buttonView, isChecked) -> editorEntry.favorite = isChecked);': 'favorite.setOnCheckedChangeListener((buttonView, isChecked) -> { editorEntry.favorite = isChecked; scheduleAutosave(); });',
              'String removed = editorEntry.photos.remove(index);\n                    try { new File(removed).delete(); } catch (Exception ignored) {}\n                    renderEditor();': 'String removed = editorEntry.photos.remove(index);\n                    try { new File(removed).delete(); } catch (Exception ignored) {}\n                    autosaveEditor(false);\n                    renderEditor();',
              'TextView autosaveHint = text("Allt sparas lokalt på den här enheten.", 12, false, muted);': 'TextView autosaveHint = text("Sparas automatiskt · allt lagras lokalt på den här enheten.", 12, false, muted);',
              'editorEntry.photos.add(copyImageToPrivate(uri));\n                renderEditor();': 'editorEntry.photos.add(copyImageToPrivate(uri));\n                autosaveEditor(false);\n                renderEditor();',
              'i.putExtra(Intent.EXTRA_TITLE, "Min_Dagbok_backup_" + LocalDate.now().format(iso) + ".dagbokzip");': 'i.putExtra(Intent.EXTRA_TITLE, "Min_Dagbok_backup_" + LocalDate.now().format(iso) + ".zip");',
              'i.setType("*/*");\n                    startActivityForResult(i, IMPORT_BACKUP);': 'i.setType("application/zip");\n                    i.putExtra(Intent.EXTRA_MIME_TYPES, new String[]{"application/zip", "application/octet-stream", "application/x-zip-compressed", "*/*"});\n                    i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);\n                    startActivityForResult(i, IMPORT_BACKUP);',
              'Toast.makeText(this, "Det gick inte att läsa eller spara filen", Toast.LENGTH_LONG).show();': 'String reason = e.getMessage();\n            if (reason == null || reason.trim().isEmpty()) reason = e.getClass().getSimpleName();\n            Toast.makeText(this, "Fel: " + reason, Toast.LENGTH_LONG).show();',
              'about.addView(text("Min Dagbok  ·  version 1.0", 15, true, text));': 'about.addView(text("Min Dagbok  ·  version 1.4.0", 15, true, text));',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Saknar förväntad kod: {old}')
              s = s.replace(old, new)

          old_back = '''        if (!"home".equals(currentPage)) {\n            hideKeyboard();\n            showHome();'''
          new_back = '''        if (!"home".equals(currentPage)) {\n            if ("editor".equals(currentPage)) autosaveEditor(false);\n            hideKeyboard();\n            showHome();'''
          if old_back not in s:
              raise SystemExit('Kunde inte koppla autospara till bakåtknappen')
          s = s.replace(old_back, new_back)

          old_shell_end = 'setContentView(root);\n    }'
          new_shell_end = '''setContentView(root);\n        if (!wide && Build.VERSION.SDK_INT >= 30) {\n            root.setOnApplyWindowInsetsListener((v, insets) -> {\n                int imeBottom = insets.getInsets(WindowInsets.Type.ime()).bottom;\n                if (bottomNavView != null) {\n                    bottomNavView.setVisibility(imeBottom > 0 ? View.GONE : View.VISIBLE);\n                }\n                if (pageHost != null) {\n                    pageHost.setPadding(0, 0, 0, imeBottom);\n                }\n                if (imeBottom > 0) {\n                    View focused = getCurrentFocus();\n                    if (focused != null) {\n                        focused.postDelayed(() -> focused.requestRectangleOnScreen(\n                                new android.graphics.Rect(0, 0, focused.getWidth(), focused.getHeight()), true), 120);\n                    }\n                }\n                return insets;\n            });\n            root.requestApplyInsets();\n        }\n    }'''
          if old_shell_end not in s:
              raise SystemExit('Kunde inte lägga till tangentbordsanpassning')
          s = s.replace(old_shell_end, new_shell_end, 1)

          old_recent = '''        if (recent.isEmpty()) {\n            c.addView(emptyState("Din dagbok är tom än så länge. Första anteckningen kan vara hur kort eller lång du vill."));\n        } else {\n            for (Entry e : recent) c.addView(entryCard(e), cardLpSmall());\n        }\n        setPage("home", pageScroll(c));'''
          new_recent = '''        if (recent.isEmpty()) {\n            c.addView(emptyState("Din dagbok är tom än så länge. Första anteckningen kan vara hur kort eller lång du vill."));\n        } else {\n            for (Entry e : recent) c.addView(entryCard(e), cardLpSmall());\n        }\n\n        LocalDate now = LocalDate.now();\n        String mmDd = String.format(Locale.ROOT, "%02d-%02d", now.getMonthValue(), now.getDayOfMonth());\n        ArrayList<Entry> memories = db.sameDay(mmDd, now.format(iso));\n        if (!memories.isEmpty()) {\n            TextView memoryTitle = sectionTitle("Den här dagen");\n            LinearLayout.LayoutParams mt = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);\n            mt.topMargin = dp(22);\n            c.addView(memoryTitle, mt);\n            TextView memorySub = text("Anteckningar från samma datum tidigare år.", 12, false, muted);\n            LinearLayout.LayoutParams ms = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);\n            ms.bottomMargin = dp(8);\n            c.addView(memorySub, ms);\n            for (Entry e : memories) c.addView(entryCard(e), cardLpSmall());\n        }\n        setPage("home", pageScroll(c));'''
          if old_recent not in s:
              raise SystemExit('Kunde inte lägga till Den här dagen')
          s = s.replace(old_recent, new_recent)

          old_stat = '''    private View statCard(String value, String label) {\n        LinearLayout c = card();\n        c.setGravity(Gravity.CENTER_VERTICAL);\n        c.addView(text(value, 28, true, accent));\n        c.addView(text(label, 12, false, muted));\n        return c;\n    }'''
          new_stat = old_stat + '''\n\n    private View moodOverviewCard() {\n        LinearLayout outer = card();\n        outer.addView(text("Humör den här månaden", 18, true, text));\n        ArrayList<Entry> entries = db.month(YearMonth.now().toString());\n        int[] counts = new int[MOOD_EMOJI.length];\n        for (Entry e : entries) counts[clampMood(e.mood)]++;\n\n        LinearLayout row = new LinearLayout(this);\n        row.setOrientation(LinearLayout.HORIZONTAL);\n        row.setGravity(Gravity.CENTER);\n        row.setPadding(0, dp(10), 0, 0);\n        for (int i = 0; i < MOOD_EMOJI.length; i++) {\n            LinearLayout cell = new LinearLayout(this);\n            cell.setOrientation(LinearLayout.VERTICAL);\n            cell.setGravity(Gravity.CENTER);\n            TextView emoji = text(MOOD_EMOJI[i], 20, false, text);\n            emoji.setGravity(Gravity.CENTER);\n            cell.addView(emoji);\n            TextView number = text(String.valueOf(counts[i]), 11, true, counts[i] > 0 ? accent : muted);\n            number.setGravity(Gravity.CENTER);\n            cell.addView(number);\n            row.addView(cell, new LinearLayout.LayoutParams(0, dp(58), 1f));\n        }\n        outer.addView(row, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));\n        return outer;\n    }'''
          if old_stat not in s:
              raise SystemExit('Kunde inte lägga till humöröversikt')
          s = s.replace(old_stat, new_stat)

          marker = '    private void chooseEditorDate() {'
          autosave_methods = '''    private void scheduleAutosave() {\n        autosaveHandler.removeCallbacks(autosaveRunnable);\n        autosaveHandler.postDelayed(autosaveRunnable, 850);\n    }\n\n    private void autosaveEditor(boolean showToast) {\n        if (editorEntry == null || editingDate == null) return;\n        autosaveHandler.removeCallbacks(autosaveRunnable);\n        editorEntry.date = editingDate.format(iso);\n        String titleValue = editorEntry.title == null ? "" : editorEntry.title.trim();\n        String bodyValue = editorEntry.body == null ? "" : editorEntry.body.trim();\n        boolean hasContent = !titleValue.isEmpty() || !bodyValue.isEmpty() || !editorEntry.photos.isEmpty();\n        if (!hasContent && editorEntry.id <= 0) return;\n        db.save(editorEntry);\n        if (showToast) Toast.makeText(this, "Anteckningen är sparad", Toast.LENGTH_SHORT).show();\n    }\n\n'''
          if marker not in s:
              raise SystemExit('Kunde inte lägga till autosparande')
          s = s.replace(marker, autosave_methods + marker)
          s = s.replace('    private void chooseEditorDate() {\n        LocalDate d = editingDate;', '    private void chooseEditorDate() {\n        autosaveEditor(false);\n        LocalDate d = editingDate;')

          start = s.find('    private void runBiometricPrompt(')
          end = s.find('    private void launchDeviceCredential(', start)
          if start < 0 or end < 0:
              raise SystemExit('Kunde inte hitta biometrimetoden')
          biometric = '''    private void runBiometricPrompt(String title, Runnable success, Runnable cancelled) {\n        if (Build.VERSION.SDK_INT < 28) {\n            launchDeviceCredential(success, cancelled);\n            return;\n        }\n\n        authShowing = true;\n        CancellationSignal signal = new CancellationSignal();\n        try {\n            if (Build.VERSION.SDK_INT >= 30) {\n                BiometricManager manager = getSystemService(BiometricManager.class);\n                int can = manager == null\n                        ? BiometricManager.BIOMETRIC_ERROR_HW_UNAVAILABLE\n                        : manager.canAuthenticate(BiometricManager.Authenticators.BIOMETRIC_STRONG);\n                if (can != BiometricManager.BIOMETRIC_SUCCESS) {\n                    authShowing = false;\n                    String message;\n                    if (can == BiometricManager.BIOMETRIC_ERROR_NONE_ENROLLED) {\n                        message = "Inget fingeravtryck är registrerat i telefonen";\n                    } else if (can == BiometricManager.BIOMETRIC_ERROR_NO_HARDWARE) {\n                        message = "Telefonen rapporterar ingen tillgänglig fingeravtrycksläsare";\n                    } else {\n                        message = "Fingeravtryck är inte tillgängligt just nu";\n                    }\n                    Toast.makeText(this, message, Toast.LENGTH_LONG).show();\n                    if (cancelled != null) cancelled.run();\n                    return;\n                }\n            }\n\n            BiometricPrompt.Builder builder = new BiometricPrompt.Builder(this)\n                    .setTitle(title)\n                    .setSubtitle("Lägg fingret på fingeravtrycksläsaren")\n                    .setNegativeButton("Använd skärmlås", getMainExecutor(),\n                            (dialog, which) -> launchDeviceCredential(success, cancelled));\n            if (Build.VERSION.SDK_INT >= 30) {\n                builder.setAllowedAuthenticators(BiometricManager.Authenticators.BIOMETRIC_STRONG);\n            }\n            BiometricPrompt prompt = builder.build();\n            prompt.authenticate(signal, getMainExecutor(), new BiometricPrompt.AuthenticationCallback() {\n                @Override public void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult result) {\n                    authShowing = false;\n                    success.run();\n                }\n                @Override public void onAuthenticationFailed() {\n                    Toast.makeText(DiaryMainActivity.this, "Fingeravtrycket kändes inte igen – försök igen", Toast.LENGTH_SHORT).show();\n                }\n                @Override public void onAuthenticationError(int errorCode, CharSequence errString) {\n                    if (errorCode == 13) return;\n                    authShowing = false;\n                    if (errorCode != BiometricPrompt.BIOMETRIC_ERROR_USER_CANCELED &&\n                            errorCode != BiometricPrompt.BIOMETRIC_ERROR_CANCELED) {\n                        Toast.makeText(DiaryMainActivity.this, "Fingeravtryck: " + errString, Toast.LENGTH_LONG).show();\n                    }\n                    if (cancelled != null) cancelled.run();\n                }\n            });\n        } catch (Exception e) {\n            authShowing = false;\n            Toast.makeText(this, "Fingeravtryck kunde inte startas: " + e.getMessage(), Toast.LENGTH_LONG).show();\n            if (cancelled != null) cancelled.run();\n        }\n    }\n\n'''
          s = s[:start] + biometric + s[end:]
          java.write_text(s, encoding='utf-8')

          manifest = Path('app/src/main/AndroidManifest.xml')
          m = manifest.read_text(encoding='utf-8')
          old = 'android:screenOrientation="unspecified"\n            android:configChanges="screenSize|smallestScreenSize|orientation|keyboard|keyboardHidden"'
          new = 'android:screenOrientation="unspecified"\n            android:windowSoftInputMode="stateHidden|adjustResize"\n            android:configChanges="screenSize|smallestScreenSize|orientation|keyboard|keyboardHidden"'
          if old not in m:
              raise SystemExit('Kunde inte lägga till windowSoftInputMode')
          manifest.write_text(m.replace(old, new), encoding='utf-8')

          Path('app/build.gradle').write_text('''plugins { id 'com.android.application' }\n\nandroid {\n    namespace 'se.steffy.receptboken'\n    compileSdk 35\n\n    signingConfigs {\n        stable {\n            storeFile file('../signing/min-dagbok-release.jks')\n            storePassword 'Dagbok2026!'\n            keyAlias 'mindagbok'\n            keyPassword 'Dagbok2026!'\n        }\n    }\n\n    defaultConfig {\n        applicationId 'se.steffy.mindagbok3'\n        minSdk 28\n        targetSdk 35\n        versionCode 2\n        versionName '1.4.0'\n    }\n\n    buildTypes {\n        debug {\n            signingConfig signingConfigs.stable\n        }\n    }\n\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n}\n''', encoding='utf-8')
          PY

      - name: Bygg Min Dagbok
        run: gradle :app:assembleDebug

      - name: Döp APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Min-Dagbok-v1.4.0.apk

      - name: Verifiera APK och signering
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs Min-Dagbok-v1.4.0.apk
          echo "--- APK-info ---"
          "$AAPT" dump badging Min-Dagbok-v1.4.0.apk | head -8

      - uses: actions/upload-artifact@v4
        with:
          name: Min-Dagbok-v1.4.0
          path: Min-Dagbok-v1.4.0.apk
