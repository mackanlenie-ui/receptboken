name: Bygg Min Dagbok
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Förbered Min Dagbok v1.2.1
        run: |
          python3 - <<'PY'
          from pathlib import Path

          java = Path('app/src/main/java/se/steffy/receptboken/DiaryMainActivity.java')
          s = java.read_text(encoding='utf-8')
          replacements = {
              'import android.app.BiometricPrompt;': 'import android.hardware.biometrics.BiometricPrompt;',
              'import android.view.WindowManager;': 'import android.view.WindowManager;\nimport android.view.WindowInsets;',
              'BiometricPrompt.BIOMETRIC_ERROR_NEGATIVE_BUTTON': '13',
              'private FrameLayout pageHost;': 'private FrameLayout pageHost;\n    private View bottomNavView;',
              'super.onCreate(savedInstanceState);': 'super.onCreate(savedInstanceState);\n        if (Build.VERSION.SDK_INT >= 30) {\n            getWindow().setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_ADJUST_NOTHING);\n        } else {\n            getWindow().setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE);\n        }',
              'root.addView(buildPhoneHeader(), new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(64)));': 'root.addView(buildPhoneHeader(), new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(76)));',
              'bar.setPadding(dp(18), 0, dp(12), 0);': 'bar.setPadding(dp(18), dp(12), dp(12), 0);',
              'root.addView(buildBottomNav(), new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(70)));': 'bottomNavView = buildBottomNav();\n            root.addView(bottomNavView, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(78)));',
              'b.setTextSize(11);': 'b.setTextSize(13);\n        b.setTypeface(Typeface.DEFAULT, Typeface.BOLD);',
              'setContentView(root);\n    }': '''setContentView(root);\n        if (!wide && Build.VERSION.SDK_INT >= 30) {\n            root.setOnApplyWindowInsetsListener((v, insets) -> {\n                int imeBottom = insets.getInsets(WindowInsets.Type.ime()).bottom;\n                if (bottomNavView != null) {\n                    bottomNavView.setVisibility(imeBottom > 0 ? View.GONE : View.VISIBLE);\n                }\n                if (pageHost != null) {\n                    pageHost.setPadding(0, 0, 0, imeBottom);\n                }\n                if (imeBottom > 0) {\n                    View focused = getCurrentFocus();\n                    if (focused != null) {\n                        focused.postDelayed(() -> focused.requestRectangleOnScreen(\n                                new android.graphics.Rect(0, 0, focused.getWidth(), focused.getHeight()), true), 120);\n                    }\n                }\n                return insets;\n            });\n            root.requestApplyInsets();\n        }\n    }''',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Saknar förväntad kod: {old}')
              s = s.replace(old, new)
          java.write_text(s, encoding='utf-8')

          manifest = Path('app/src/main/AndroidManifest.xml')
          m = manifest.read_text(encoding='utf-8')
          old = 'android:screenOrientation="unspecified"\n            android:configChanges="screenSize|smallestScreenSize|orientation|keyboard|keyboardHidden"'
          new = 'android:screenOrientation="unspecified"\n            android:windowSoftInputMode="stateHidden|adjustResize"\n            android:configChanges="screenSize|smallestScreenSize|orientation|keyboard|keyboardHidden"'
          if old not in m:
              raise SystemExit('Kunde inte lägga till windowSoftInputMode')
          manifest.write_text(m.replace(old, new), encoding='utf-8')

          gradle = Path('app/build.gradle')
          g = gradle.read_text(encoding='utf-8')
          g = g.replace("applicationId 'se.steffy.mindagbok'", "applicationId 'se.steffy.mindagbok2'")
          g = g.replace("versionCode 1", "versionCode 1")
          g = g.replace("versionName '1.0'", "versionName '1.2.1'")
          gradle.write_text(g, encoding='utf-8')
          PY
      - name: Bygg Min Dagbok
        run: gradle :app:assembleDebug
      - name: Döp APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Min-Dagbok-v1.2.1-REN.apk
      - name: Verifiera APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs Min-Dagbok-v1.2.1-REN.apk
          echo "--- APK-info ---"
          "$AAPT" dump badging Min-Dagbok-v1.2.1-REN.apk | head -8
      - uses: actions/upload-artifact@v4
        with:
          name: Min-Dagbok-v1.2.1-REN
          path: Min-Dagbok-v1.2.1-REN.apk
