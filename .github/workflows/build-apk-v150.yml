name: Bygg Min Dagbok v1.5.0
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Återskapa v1.4.2-grunden
        run: |
          base64 -d signing/min-dagbok-release.jks.b64 > signing/min-dagbok-release.jks
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          def run_python_block(path, section):
              wf = Path(path).read_text(encoding='utf-8')
              section_pos = wf.index(section)
              marker = "          python3 - <<'PY'\n"
              start = wf.index(marker, section_pos) + len(marker)
              end = wf.index("\n          PY", start)
              code = textwrap.dedent(wf[start:end])
              exec(compile(code, path, 'exec'), {'__name__': '__main__'})

          run_python_block('.github/workflows/build-apk-v142.yml', '- name: Återskapa v1.4.1-grunden')
          run_python_block('.github/workflows/build-apk-v142.yml', '- name: Förbättra scrollning i skrivläget')
          PY

      - name: Förbättra DeX-layout och desktopfunktioner
        run: |
          python3 - <<'PY'
          from pathlib import Path

          java = Path('app/src/main/java/se/steffy/receptboken/DiaryMainActivity.java')
          s = java.read_text(encoding='utf-8')

          old = '''        if (wide) {\n            root.addView(buildSidebar(), new LinearLayout.LayoutParams(dp(244), ViewGroup.LayoutParams.MATCH_PARENT));'''
          new = '''        if (wide) {\n            root.addView(buildSidebar(), new LinearLayout.LayoutParams(dp(dexSidebarWidthDp()), ViewGroup.LayoutParams.MATCH_PARENT));'''
          if old not in s:
              raise SystemExit('Kunde inte göra sidomenyn responsiv')
          s = s.replace(old, new, 1)

          s = s.replace('TextView title = text("Min Dagbok", 23, true, text);', 'TextView title = text("Min Dagbok", 25, true, text);', 1)
          s = s.replace('b.setTextSize(15);\n        b.setGravity(Gravity.START | Gravity.CENTER_VERTICAL);', 'b.setTextSize(16);\n        b.setGravity(Gravity.START | Gravity.CENTER_VERTICAL);', 1)
          s = s.replace('LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(52));', 'LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(56));', 1)

          old = '''    private ScrollView pageScroll(LinearLayout content) {\n        ScrollView scroll = new ScrollView(this);\n        scroll.setFillViewport(true);\n        scroll.setClipToPadding(false);\n        scroll.addView(content, new ScrollView.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));\n        return scroll;\n    }'''
          new = '''    private ScrollView pageScroll(LinearLayout content) {\n        ScrollView scroll = new ScrollView(this);\n        scroll.setFillViewport(true);\n        scroll.setClipToPadding(false);\n        if (wide) {\n            FrameLayout center = new FrameLayout(this);\n            int hostDp = Math.max(620, screenWidthDp() - dexSidebarWidthDp());\n            int maxDp = screenWidthDp() >= 1600 ? 1280 : (screenWidthDp() >= 1100 ? 1120 : 900);\n            int contentDp = Math.max(560, Math.min(maxDp, hostDp - 48));\n            FrameLayout.LayoutParams cp = new FrameLayout.LayoutParams(\n                    dp(contentDp), ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.TOP | Gravity.CENTER_HORIZONTAL);\n            center.addView(content, cp);\n            scroll.addView(center, new ScrollView.LayoutParams(\n                    ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));\n        } else {\n            scroll.addView(content, new ScrollView.LayoutParams(\n                    ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));\n        }\n        return scroll;\n    }'''
          if old not in s:
              raise SystemExit('Kunde inte lägga till maxbredd i DeX')
          s = s.replace(old, new, 1)

          old = '''    private LinearLayout pageColumn() {\n        LinearLayout c = new LinearLayout(this);\n        c.setOrientation(LinearLayout.VERTICAL);\n        int horizontal = wide ? dp(36) : dp(18);\n        c.setPadding(horizontal, dp(18), horizontal, dp(34));\n        return c;\n    }'''
          new = '''    private LinearLayout pageColumn() {\n        LinearLayout c = new LinearLayout(this);\n        c.setOrientation(LinearLayout.VERTICAL);\n        int horizontal = wide ? dp(screenWidthDp() >= 1100 ? 30 : 26) : dp(18);\n        c.setPadding(horizontal, wide ? dp(26) : dp(18), horizontal, wide ? dp(46) : dp(34));\n        return c;\n    }'''
          if old not in s:
              raise SystemExit('Kunde inte justera DeX-marginaler')
          s = s.replace(old, new, 1)

          old = '''    private void showHome() {\n        currentPage = "home";\n        if (wide) buildShell();\n        LinearLayout c = pageColumn();'''
          new = '''    private void showHome() {\n        currentPage = "home";\n        if (wide) {\n            buildShell();\n            showHomeWide();\n            return;\n        }\n        LinearLayout c = pageColumn();'''
          if old not in s:
              raise SystemExit('Kunde inte koppla DeX-startsidan')
          s = s.replace(old, new, 1)

          marker = '    private View statCard(String value, String label) {'
          wide_home = r'''    private void showHomeWide() {
        LinearLayout c = pageColumn();
        int hour = Calendar.getInstance().get(Calendar.HOUR_OF_DAY);
        String greeting = hour < 10 ? "God morgon" : hour < 17 ? "God dag" : "God kväll";
        c.addView(text(greeting, 36, true, text));
        TextView date = text(capitalize(LocalDate.now().format(longDate)), 16, false, muted);
        LinearLayout.LayoutParams dateLp = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
        dateLp.bottomMargin = dp(20);
        c.addView(date, dateLp);

        boolean large = screenWidthDp() >= 1100;
        LinearLayout dashboard = new LinearLayout(this);
        dashboard.setOrientation(large ? LinearLayout.HORIZONTAL : LinearLayout.VERTICAL);
        dashboard.setGravity(Gravity.TOP);

        LinearLayout left = new LinearLayout(this);
        left.setOrientation(LinearLayout.VERTICAL);
        LinearLayout right = new LinearLayout(this);
        right.setOrientation(LinearLayout.VERTICAL);

        Entry today = db.getByDate(LocalDate.now().format(iso));
        LinearLayout todayCard = card();
        todayCard.addView(text(today == null ? "Hur har din dag varit?" : MOOD_EMOJI[clampMood(today.mood)] + "  Dagens anteckning", 21, true, text));
        TextView todayBody = text(today == null ? "Skriv några rader om det som hänt, hur du mår eller något du vill minnas." : preview(today), 15, false, muted);
        LinearLayout.LayoutParams tblp = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
        tblp.topMargin = dp(8);
        tblp.bottomMargin = dp(16);
        todayCard.addView(todayBody, tblp);
        Button write = primaryButton(today == null ? "✎  Skriv idag" : "✎  Fortsätt skriva");
        write.setOnClickListener(v -> openEditor(LocalDate.now()));
        todayCard.addView(write, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(54)));
        left.addView(todayCard, cardLp());

        left.addView(sectionTitle("Senaste anteckningar"));
        ArrayList<Entry> recent = db.recent(6);
        if (recent.isEmpty()) {
            LinearLayout empty = card();
            TextView icon = text("📖", 38, false, text);
            icon.setGravity(Gravity.CENTER);
            empty.addView(icon);
            TextView msg = text("Din dagbok är tom än så länge. Börja med några rader om dagen.", 14, false, muted);
            msg.setGravity(Gravity.CENTER);
            LinearLayout.LayoutParams mlp = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
            mlp.topMargin = dp(8);
            mlp.bottomMargin = dp(14);
            empty.addView(msg, mlp);
            Button first = outlinedButton("Skriv första anteckningen");
            first.setOnClickListener(v -> openEditor(LocalDate.now()));
            empty.addView(first, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(50)));
            left.addView(empty, cardLpSmall());
        } else {
            for (Entry e : recent) left.addView(entryCard(e), cardLpSmall());
        }

        LinearLayout stats = new LinearLayout(this);
        stats.setOrientation(LinearLayout.HORIZONTAL);
        String mm = YearMonth.now().toString();
        stats.addView(statCard(String.valueOf(db.countMonth(mm)), "den här månaden"), new LinearLayout.LayoutParams(0, dp(112), 1f));
        Space statGap = new Space(this);
        stats.addView(statGap, new LinearLayout.LayoutParams(dp(12), 1));
        stats.addView(statCard(String.valueOf(db.countAll()), "totalt"), new LinearLayout.LayoutParams(0, dp(112), 1f));
        right.addView(stats, cardLpSmall());
        right.addView(moodOverviewCard(), cardLp());

        LocalDate now = LocalDate.now();
        String mmDd = String.format(Locale.ROOT, "%02d-%02d", now.getMonthValue(), now.getDayOfMonth());
        ArrayList<Entry> memories = db.sameDay(mmDd, now.format(iso));
        if (!memories.isEmpty()) {
            right.addView(sectionTitle("Den här dagen"));
            TextView memorySub = text("Anteckningar från samma datum tidigare år.", 13, false, muted);
            LinearLayout.LayoutParams ms = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
            ms.bottomMargin = dp(8);
            right.addView(memorySub, ms);
            for (Entry e : memories) right.addView(entryCard(e), cardLpSmall());
        } else {
            LinearLayout tips = card();
            tips.addView(text("⌨  Snabbkommandon i DeX", 18, true, text));
            TextView shortcuts = text("Ctrl+N  Ny anteckning\nCtrl+F  Sök\nCtrl+S  Spara medan du skriver", 14, false, muted);
            shortcuts.setLineSpacing(dp(4), 1.12f);
            LinearLayout.LayoutParams shp = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
            shp.topMargin = dp(10);
            tips.addView(shortcuts, shp);
            right.addView(tips, cardLp());
        }

        if (large) {
            dashboard.addView(left, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1.18f));
            Space gap = new Space(this);
            dashboard.addView(gap, new LinearLayout.LayoutParams(dp(18), 1));
            dashboard.addView(right, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 0.82f));
        } else {
            dashboard.addView(left, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));
            dashboard.addView(right, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));
        }
        c.addView(dashboard, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));
        setPage("home", pageScroll(c));
    }

'''
          if marker not in s:
              raise SystemExit('Kunde inte lägga till DeX-startsidan')
          s = s.replace(marker, wide_home + marker, 1)

          old = '''    private TextView text(String value, int sp, boolean bold, int color) {\n        TextView t = new TextView(this);\n        t.setText(value);\n        t.setTextSize(sp);'''
          new = '''    private TextView text(String value, int sp, boolean bold, int color) {\n        TextView t = new TextView(this);\n        t.setText(value);\n        float scale = wide ? (screenWidthDp() >= 1100 ? 1.12f : 1.06f) : 1f;\n        t.setTextSize(sp * scale);'''
          if old not in s:
              raise SystemExit('Kunde inte skala DeX-typografi')
          s = s.replace(old, new, 1)

          s = s.replace('b.setTextSize(15);\n        b.setTypeface(Typeface.DEFAULT, Typeface.BOLD);', 'b.setTextSize(wide ? 16 : 15);\n        b.setTypeface(Typeface.DEFAULT, Typeface.BOLD);', 1)
          s = s.replace('b.setTextSize(14);\n        b.setTextColor(text);', 'b.setTextSize(wide ? 15 : 14);\n        b.setTextColor(text);', 1)

          old = '''        b.setPadding(dp(16), 0, dp(16), 0);\n        return b;\n    }\n\n    private Button outlinedButton'''
          new = '''        b.setPadding(dp(16), 0, dp(16), 0);\n        desktopHover(b);\n        return b;\n    }\n\n    private Button outlinedButton'''
          if old not in s:
              raise SystemExit('Kunde inte lägga hover på huvudknappar')
          s = s.replace(old, new, 1)

          old = '''        b.setPadding(dp(14), 0, dp(14), 0);\n        return b;\n    }\n\n    private Button iconButton'''
          new = '''        b.setPadding(dp(14), 0, dp(14), 0);\n        desktopHover(b);\n        return b;\n    }\n\n    private Button iconButton'''
          if old not in s:
              raise SystemExit('Kunde inte lägga hover på sekundärknappar')
          s = s.replace(old, new, 1)

          old = '''        card.setOnClickListener(v -> showReader(e));\n        return card;'''
          new = '''        card.setOnClickListener(v -> showReader(e));\n        desktopHover(card);\n        return card;'''
          if old not in s:
              raise SystemExit('Kunde inte lägga hover på anteckningskort')
          s = s.replace(old, new, 1)

          marker = '    private int clampMood(int m) {'
          helpers = r'''    private int screenWidthDp() {
        return getResources().getConfiguration().screenWidthDp;
    }

    private int dexSidebarWidthDp() {
        int w = screenWidthDp();
        if (w >= 1600) return 292;
        if (w >= 1100) return 272;
        return 252;
    }

    private void desktopHover(View v) {
        if (!wide || v == null) return;
        v.setOnHoverListener((view, event) -> {
            if (event.getAction() == android.view.MotionEvent.ACTION_HOVER_ENTER) {
                view.animate().scaleX(1.012f).scaleY(1.012f).setDuration(90).start();
            } else if (event.getAction() == android.view.MotionEvent.ACTION_HOVER_EXIT) {
                view.animate().scaleX(1f).scaleY(1f).setDuration(90).start();
            }
            return false;
        });
    }

'''
          if marker not in s:
              raise SystemExit('Kunde inte lägga till DeX-hjälpmetoder')
          s = s.replace(marker, helpers + marker, 1)

          marker = '    @Override\n    public void onBackPressed() {'
          shortcuts = r'''    @Override
    public boolean onKeyDown(int keyCode, android.view.KeyEvent event) {
        if (wide && event != null && event.isCtrlPressed()) {
            if (keyCode == android.view.KeyEvent.KEYCODE_N) {
                openEditor(LocalDate.now());
                return true;
            }
            if (keyCode == android.view.KeyEvent.KEYCODE_F) {
                showSearch();
                return true;
            }
            if (keyCode == android.view.KeyEvent.KEYCODE_S && "editor".equals(currentPage)) {
                autosaveEditor(true);
                return true;
            }
        }
        return super.onKeyDown(keyCode, event);
    }

'''
          if marker not in s:
              raise SystemExit('Kunde inte lägga till tangentbordsgenvägar')
          s = s.replace(marker, shortcuts + marker, 1)

          s = s.replace('Min Dagbok  ·  version 1.4.2', 'Min Dagbok  ·  version 1.5.0')
          java.write_text(s, encoding='utf-8')

          gradle = Path('app/build.gradle')
          g = gradle.read_text(encoding='utf-8')
          g = g.replace("versionCode 4", "versionCode 5")
          g = g.replace("versionName '1.4.2'", "versionName '1.5.0'")
          gradle.write_text(g, encoding='utf-8')
          PY

      - name: Bygg Min Dagbok
        run: gradle :app:assembleDebug

      - name: Döp APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Min-Dagbok-v1.5.0.apk

      - name: Verifiera APK och signering
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs Min-Dagbok-v1.5.0.apk
          "$AAPT" dump badging Min-Dagbok-v1.5.0.apk | head -8

      - uses: actions/upload-artifact@v4
        with:
          name: Min-Dagbok-v1.5.0
          path: Min-Dagbok-v1.5.0.apk
